name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A published Ocean release reaches the cards without a manual commit. The schedule is the trigger that
  # needs no cross-repository token; the dispatch lets the Ocean repository ask for an immediate run once its
  # token exists.
  schedule:
    - cron: '23 */6 * * *'
  repository_dispatch:
    types: [ocean-release]

permissions:
  # The refresh step commits the snapshot when a release landed; every other run leaves the tree untouched.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install packages
        run: bun install --frozen-lockfile

      # The snapshot is a cache of the Releases API, so every publishing run refreshes it before the build
      # reads it. A pull request keeps the committed snapshot: a review must build the same bytes as main.
      - if: github.event_name != 'pull_request'
        name: Refresh the download snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-downloads.mjs

      - if: github.event_name != 'pull_request'
        name: Record a snapshot that moved
        run: |
          if git diff --quiet -- public/downloads/releases.json; then
            echo "The saved snapshot already lists the newest release."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/releases.json
          git commit -m 'Refresh the download snapshot from the newest release [skip ci]'
          git push

      - name: Build the static export
        run: node node_modules/next/dist/bin/next build

      - name: Check the built site
        run: node --import tsx --test tests/*.test.mjs

      # A pull request proves the pipeline; only a push to main publishes, because Pages accepts an artifact from
      # the default branch and the deployment would otherwise overwrite the live site from a review branch.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
